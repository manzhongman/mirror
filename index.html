<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>放大镜子</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="镜子">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 布局：整屏都是镜面；按钮是浮在画面上的几块透明玻璃。
   不用时玻璃缩回快门里消失，点一下画面再从快门里分出来 */
@property --gr{syntax:'<length>';inherits:false;initial-value:26px}
:root{
  --ink:#0a0e0f;            /* 略偏青的黑 */
  --fg:#f7fbfa;
  --dim:#c3cfcc;
  --mint:#7ff0cf;
  --lamp:#ffffff;           /* 补光用纯白，最亮 */
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{
  position:fixed;inset:0;color:var(--fg);font:15px/1.4 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  /* 玻璃上的字和图标：默认白色；背后画面亮时换成深色（见 .ink） */
  --on:var(--fg); --act:var(--mint);
  --track:rgba(255,255,255,.36);
  --shade:0 0 1px rgba(0,0,0,.30),0 1px 4px rgba(0,0,0,.38);
  --ishade:drop-shadow(0 1px 2.5px rgba(0,0,0,.45));
}
body.lamp{ --on:#0a0e0f; --act:#0a7d68; --track:rgba(10,14,15,.16); --shade:none; --ishade:none; }

#frame{position:fixed;inset:0;background:#000;transition:background .25s}
#stage{
  position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;
  transition:inset .25s,border-radius .25s;
}
#pan{position:absolute;inset:0;transform-origin:50% 50%}
video{display:block;width:100%;height:100%;object-fit:cover}
video.mirror{transform:scaleX(-1)}
.boost video{filter:brightness(1.4) contrast(1.08)}
/* 玻璃边缘里的那份画面，颜色和玻璃中间一样略微更鲜，里外才是同一块玻璃 */
.lens video{filter:saturate(1.18)}
.boost .lens video{filter:brightness(1.4) contrast(1.08) saturate(1.18)}
/* 定格的那一下，画面像快门一样暗一瞬 */
#blink{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#blink.go{animation:blink .24s ease-out}
@keyframes blink{0%{opacity:0}30%{opacity:.5}100%{opacity:0}}

/* 补光：画面缩成一个窗口，其余整块屏幕发白光。强光时窗口更小，白光面积更大 */
.lamp #frame{background:var(--lamp)}
.lamp #stage{
  inset:calc(env(safe-area-inset-top,0px) + 64px) 30px calc(env(safe-area-inset-bottom,0px) + 212px);
  border-radius:34px;
}
.lamp2 #stage{
  inset:calc(env(safe-area-inset-top,0px) + 20vh) 17vw calc(env(safe-area-inset-bottom,0px) + 36vh);
  border-radius:40px;
}

/* ---------- 液态玻璃 ---------- */
/* 一块玻璃从下到上有五层：
   1 玻璃本体：通透，背后的画面只略微柔化、颜色略微更鲜
   2 手指按着的地方从里面亮起来的光
   3 边缘折光：另一份同样的摄像头画面，稍微放大，只在边上露出一圈
   4 字和图标
   5 最外面那条细细的高光
   全部交给手机的图形系统去合成，页面自己不逐帧计算 */
.glass{
  position:relative;border-radius:999px;
  color:var(--on);text-shadow:var(--shade);
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.03) 40%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.10));
  -webkit-backdrop-filter:blur(2px) saturate(118%);backdrop-filter:blur(2px) saturate(118%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.10),0 9px 24px rgba(0,0,0,.20),0 2px 5px rgba(0,0,0,.15);
  transition:color .3s,background-color .35s,box-shadow .35s;
}
/* 2 手指按着的地方亮起来，光从指尖向四周漫开 */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(var(--gr,26px) circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.42),rgba(255,255,255,.12) 55%,rgba(255,255,255,0));
  transition:opacity .45s,--gr .5s cubic-bezier(.2,.7,.3,1);
}
.glass.pressed::before{opacity:1;--gr:130px;transition:opacity .12s,--gr .5s cubic-bezier(.2,.7,.3,1)}
/* 3 边缘折光的那一圈，上面再罩一层斜面受光：左上偏冷，右下偏暖 */
.lens{
  position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
}
.lens::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(135deg,rgba(232,244,255,.36),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,238,222,.24)),
    linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%,rgba(255,255,255,.14));
}
.world{position:absolute}
.panc{position:absolute;inset:0;transform-origin:50% 50%}
/* 5 边缘高光：一条细线，左上最亮，右下有一道回光。里面那块渐变会沿着边滑动 */
.rim{
  position:absolute;inset:0;border-radius:inherit;padding:1.25px;overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.rim i{position:absolute;left:50%;top:50%}
/* 背后画面亮（比如正对着牙齿）：玻璃略微提亮，边缘多一条极细的暗线，免得白玻璃融进白背景 */
.glass.bright{
  background-color:rgba(255,255,255,.20);
  box-shadow:0 0 0 .5px rgba(0,0,0,.17),0 10px 26px rgba(0,0,0,.17),0 2px 5px rgba(0,0,0,.12);
}
/* 白光背景上的玻璃：浅色的薄片，不需要折光 */
.lamp .glass{
  background:linear-gradient(180deg,rgba(10,14,15,.02),rgba(10,14,15,.06));
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:inset 0 1.5px 1px #fff,inset 0 0 0 1px rgba(10,14,15,.07),0 8px 20px rgba(10,14,15,.10);
}
.lamp .rim,.lamp .lens,.settling .lens{display:none}

#top{
  position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.chip{
  padding:7px 14px;font-size:13px;letter-spacing:.01em;transition:opacity .35s,color .3s;
  -webkit-backdrop-filter:blur(10px) saturate(170%);backdrop-filter:blur(10px) saturate(170%);
  box-shadow:inset 0 .75px 0 rgba(255,255,255,.7),inset 0 0 0 .5px rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.18);
}
#hint{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(12,16,17,.30)}
.quiet #hint,#hint.gone{opacity:0}
#state{color:#06352c;text-shadow:none;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),rgba(127,240,207,.88)}
#state:not([hidden]){animation:pop .4s var(--spring)}
@keyframes pop{0%{opacity:0;transform:translateY(-8px) scale(.85)}100%{opacity:1;transform:none}}
#diag{font-size:11px;line-height:1.5;border-radius:16px;text-align:center;max-width:100%;
  background:rgba(12,16,17,.62);font-variant-numeric:tabular-nums}

#bar{
  position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;gap:12px;visibility:hidden;
}
.quiet #bar{pointer-events:none}

/* ---------- 放大滑杆 ---------- */
#zoomrow{display:flex;align-items:center;gap:10px;padding:4px 18px 4px 12px}
#zoomOut{
  position:relative;flex:none;min-width:50px;text-align:right;transform-origin:100% 50%;
  font:600 16px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em;transition:color .3s;
}
#zoomOut.snap{animation:snap .28s ease-out}
@keyframes snap{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.rail{position:relative;flex:1;min-width:0;display:flex;transition:color .3s;--t:0}
/* 刻度：1、2、5、10、20、50、100 倍，像镜头对焦环上的标记。滑到刻度附近会轻轻吸住 */
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{
  position:absolute;top:calc(50% + 9px);left:calc(18px + (100% - 36px) * var(--k));
  width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.6;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:42px;margin:0;background:transparent;
  color:inherit;touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(90deg,currentColor calc(18px + (100% - 36px) * var(--t)),var(--track) 0);
}
/* 系统自带的旋钮只负责接住手指，看不见；看得见的旋钮是下面的 .knob */
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:42px;margin-top:-19px;border:0;background:transparent}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:currentColor}
input[type=range]::-moz-range-thumb{width:36px;height:42px;border:0;background:transparent}
/* 旋钮：平时是一颗实心白色胶囊；手指按住时变成一小块透明玻璃，透过它看到的滑轨被放大 */
.knob{
  position:absolute;top:50%;left:calc(18px + (100% - 36px) * var(--t));
  width:38px;height:24px;margin:-12px 0 0 -19px;border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.06));
  box-shadow:inset 0 1px .5px rgba(255,255,255,.95),inset 0 -1px .5px rgba(255,255,255,.4),
             inset 0 0 0 .75px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.28);
  transition:transform .4s var(--spring);
}
.knob::before{
  content:"";position:absolute;left:4px;right:4px;top:50%;height:7px;margin-top:-3.5px;border-radius:3.5px;
  background:linear-gradient(90deg,currentColor 50%,var(--track) 50%);
}
.knob::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,#ffffff,#edf1f0);
  box-shadow:inset 0 1px 0 #fff,0 0 0 .5px rgba(0,0,0,.10);
  transition:opacity .22s;
}
.rail.grab .knob{transform:scale(1.42,1.3)}
.rail.grab .knob::after{opacity:0}

/* ---------- 按钮 ---------- */
.tools{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.group{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.tool{
  position:relative;isolation:isolate;display:grid;justify-items:center;gap:3px;min-width:0;padding:8px 2px 7px;
  border:0;border-radius:999px;background:transparent;
  color:inherit;text-shadow:inherit;font:500 11.5px/1.2 var(--ui);letter-spacing:.02em;
  transition:color .3s,transform .3s var(--spring);
}
.tool svg{
  width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:var(--ishade);transition:transform .55s var(--spring);
}
.tool svg .fill{fill:currentColor;stroke:none}
.tool svg.bump{animation:bump .45s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.24)}100%{transform:scale(1)}}
.tool:active{transform:scale(1.08)}
/* 按钮底下的那片小玻璃：手指按着时浮起一片透明的；功能开着时是薄荷色的，弹出来 */
.tool::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transform:scale(.7);
  background:rgba(255,255,255,.16);box-shadow:inset 0 1px .5px rgba(255,255,255,.5);
  transition:opacity .2s,transform .4s var(--spring);
}
.tool:active::before{opacity:1;transform:none}
/* 背后画面亮的地方，字和图标换成深色，和苹果的玻璃一样会自己变。每个按钮各看各的背后 */
.ink{ --on:#0a0e0f; --track:rgba(10,14,15,.22); --shade:none; --ishade:none; color:var(--on); text-shadow:none }
.tool[aria-pressed=true]{color:#06352c;text-shadow:none;--ishade:none}
.tool[aria-pressed=true]::before{
  opacity:1;transform:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 55%,rgba(0,70,50,.05)),rgba(98,232,196,.84);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.95),inset 0 -1px .5px rgba(255,255,255,.35),
             inset 0 0 0 .75px rgba(205,255,241,.6),0 3px 12px rgba(20,120,95,.30);
}
.lamp .tool[aria-pressed=true]{color:var(--act)}
.lamp .tool[aria-pressed=true]::before{background:rgba(10,125,104,.12);box-shadow:inset 0 0 0 1px rgba(10,125,104,.30)}
.lamp .tool:active::before{background:rgba(10,14,15,.07);box-shadow:none}

/* 快门：玻璃圆环里一颗白色圆片 */
#freeze{
  width:76px;height:76px;padding:0;border:0;display:grid;place-items:center;font:600 13px/1 var(--ui);letter-spacing:.02em;
}
#freeze span{
  position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;
  color:#0a0e0f;text-shadow:none;
  background:linear-gradient(180deg,#ffffff,#e9eeed);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.25);
  transition:background .2s,transform .35s var(--spring);
}
#freeze:active span{transform:scale(.88)}
.lamp #freeze span{background:#0a0e0f;color:#fff;box-shadow:0 2px 8px rgba(10,14,15,.25)}
#freeze[aria-pressed=true] span{background:linear-gradient(180deg,#b6f8e4,#63dcb9);color:#06352c}

button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:3px}

#msg{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;
  padding:32px;text-align:center;background:var(--ink);color:var(--fg);
}
#msg h1{margin:0;font:600 22px/1.3 var(--ui)}
#msg p{margin:0;max-width:22em;color:var(--dim);line-height:1.7}
#retry{
  border:0;border-radius:999px;padding:13px 28px;background:var(--mint);color:var(--ink);
  font:600 16px/1 var(--ui);
}
/* 系统里开了"减弱动态效果"：不弹、不滑、不闪 */
@media (prefers-reduced-motion:reduce){
  #stage,#frame,.glass,.glass::before,.tool,.tool::before,.tool svg,.chip,#freeze span,.knob,.knob::after{transition:none}
  #blink.go,#state:not([hidden]),#zoomOut.snap,.tool svg.bump{animation:none}
}
/* 系统里开了"降低透明度"：玻璃换成不透明的底，字始终看得清 */
@media (prefers-reduced-transparency:reduce){
  .glass{background-color:rgba(24,30,32,.80);-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass.bright{background-color:rgba(244,247,246,.88)}
  .lens{display:none}
}
</style>
</head>
<body class="quiet">
<div id="frame">
  <div id="stage"><div id="pan"><video id="v" class="mirror" playsinline autoplay muted></video></div></div>
  <div id="blink"></div>
</div>

<div id="top">
  <span class="chip glass" id="hint">双指放大 · 拖动移动 · 点一下画面收起按钮</span>
  <span class="chip glass" id="state" hidden>已定格</span>
  <span class="chip" id="diag" hidden></span>
</div>

<div id="bar">
  <div class="glass live" id="zoomrow">
    <div class="rail">
      <div class="ticks" aria-hidden="true"><i style="--k:0"></i><i style="--k:.1505"></i><i style="--k:.3495"></i><i style="--k:.5"></i><i style="--k:.6505"></i><i style="--k:.8495"></i><i style="--k:1"></i></div>
      <input id="zoom" type="range" min="0" max="1" step="0.001" value="0" aria-label="放大倍数">
      <i class="knob" aria-hidden="true"></i>
    </div>
    <output id="zoomOut" for="zoom" aria-live="polite">1.0×</output>
  </div>
  <div class="tools">
    <div class="group glass live" id="groupL">
      <button class="tool" id="lamp" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.9"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.35 5.35l1.65 1.65M17 17l1.65 1.65M5.35 18.65 7 17M17 7l1.65-1.65"/></svg>
        <span id="lampLabel">补光</span>
      </button>
      <button class="tool" id="boost" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3"/><path class="fill" d="M12 5.6a6.4 6.4 0 0 1 0 12.8z"/></svg>
        <span>提亮</span>
      </button>
    </div>
    <button id="freeze" class="glass live" type="button" aria-pressed="false" aria-label="定格画面"><span id="freezeLabel">定格</span></button>
    <div class="group glass live" id="groupR">
      <button class="tool" id="reset" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.7 6v4.6h4.6"/><path d="M5.6 14.5a7 7 0 1 0 1.65-7.25L3.7 10.6"/></svg>
        <span>还原</span>
      </button>
      <button class="tool" id="flip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 5.8v4.6H16M3.4 18.2v-4.6H8"/><path d="M5.4 9.7a7 7 0 0 1 11.6-2.6l3.6 3.3M3.4 13.6 7 17a7 7 0 0 0 11.6-2.7"/></svg>
        <span id="flipLabel">后置</span>
      </button>
    </div>
  </div>
</div>

<div id="msg" hidden>
  <h1 id="msgTitle">需要打开摄像头</h1>
  <p id="msgText"></p>
  <button id="retry" type="button">打开摄像头</button>
</div>

<script>
(function(){
  'use strict';
  var VER = 8;
  var $ = function(id){ return document.getElementById(id); };
  var body = document.body;
  var v = $('v'), stage = $('stage'), pan = $('pan'), bar = $('bar');
  var zoomEl = $('zoom'), zoomOut = $('zoomOut'), hint = $('hint'), stateChip = $('state');
  var rail = document.querySelector('#zoomrow .rail');
  var ZMAX = 100;                 /* 100 倍时屏幕上只剩十几个像素点，再大没有意义 */
  var LOGMAX = Math.log(ZMAX);
  var TICKS = [1, 2, 5, 10, 20, 50, 100].map(function(x){ return Math.log(x) / LOGMAX; });
  var z = 1, tx = 0, ty = 0;
  var facing = 'user', mirrored = true, stream = null, track = null;
  var frozen = false, torch = false, canTorch = false, starting = false, boostOn = false;
  var lampLevel = 0;              /* 0 关，1 补光，2 强光 */
  var calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

  /* 轻轻震一下。iPhone 的网页只有拨动开关时才会震，所以藏了一个看不见的开关，需要震的时候拨它一下。
     不支持的手机上什么都不会发生 */
  var hapticLabel = null;
  try {
    hapticLabel = document.createElement('label');
    hapticLabel.hidden = true; hapticLabel.setAttribute('aria-hidden', 'true');
    var hapticSwitch = document.createElement('input');
    hapticSwitch.type = 'checkbox'; hapticSwitch.setAttribute('switch', ''); hapticSwitch.tabIndex = -1;
    hapticLabel.appendChild(hapticSwitch); body.appendChild(hapticLabel);
  } catch (_) { hapticLabel = null; }
  function haptic(){ try { if (hapticLabel) hapticLabel.click(); } catch (_) {} }

  /* ================= 镜面：放大与移动 ================= */
  var box = null, painting = 0, shownZoom = '';

    var a = Array.from(pts.values()), o = origin();
    if (a.length === 1) {
      g = { n: 1, x: a[0][0], y: a[0][1], tx: tx, ty: ty, moved: false };
    } else if (a.length >= 2) {
      g = { n: 2,
            d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1,
            mx: (a[0][0] + a[1][0]) / 2 - o.x, my: (a[0][1] + a[1][1]) / 2 - o.y,
            z: z, tx: tx, ty: ty };
    } else { g = null; }
  }
  stage.addEventListener('pointerdown', function(e){
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size >= 2) multi = true;      /* 用过两根手指的这一次，抬手时不算"点了一下" */
    tw = null;
    begin();
  });
  stage.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    var a = Array.from(pts.values()), o = origin();
    if (g.n === 1 && a.length === 1) {
      var dx = a[0][0] - g.x, dy = a[0][1] - g.y;
      if (!g.moved && Math.hypot(dx, dy) > 8) { g.moved = true; sleep(); }
      if (g.moved) { tx = g.tx + dx; ty = g.ty + dy; apply(); }
    } else if (g.n === 2 && a.length >= 2) {
      var d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
      var mx = (a[0][0] + a[1][0]) / 2 - o.x, my = (a[0][1] + a[1][1]) / 2 - o.y;
      var nz = clamp(g.z * d / g.d, 1, ZMAX), k = nz / g.z;
      tx = mx - (g.mx - g.tx) * k; ty = my - (g.my - g.ty) * k; z = nz;
      apply(); used(); sleep();
    }
  });
  function end(e){
    if (!pts.has(e.pointerId)) return;
    var tap = g && g.n === 1 && !g.moved && !multi && e.type === 'pointerup';
    pts.delete(e.pointerId);
    if (pts.size === 0) multi = false;
    begin();
    if (!tap) return;
    if (tapTimer) {                       /* 第二下：双击放大 */
      clearTimeout(tapTimer); tapTimer = null;
      var o = origin();
      setZoom(z > 1.05 ? 1 : 3, e.clientX - o.x, e.clientY - o.y, true);
      used(); haptic();
    } else {                              /* 只点了一下：收起或显示按钮 */
      tapTimer = setTimeout(function(){
        tapTimer = null;
        if (quiet) wake(); else sleep();
      }, 280);
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  /* 阻止 Safari 自己的整页缩放 */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
  });

  /* ---------- 滑杆 ---------- */
  var lastTick = 0;
  zoomEl.addEventListener('pointerdown', function(){ grabbing = true; rail.classList.add('grab'); haptic(); });
  zoomEl.addEventListener('input', function(){
    var s = parseFloat(zoomEl.value), hit = -1;
    /* 滑到刻度附近轻轻吸住，这样很容易停在整 2 倍、5 倍、10 倍上 */
    for (var i = 0; i < TICKS.length; i++) if (Math.abs(s - TICKS[i]) < 0.013) { s = TICKS[i]; hit = i; }
    if (hit !== lastTick) {
      lastTick = hit;
      if (hit >= 0) {
        haptic();
        zoomOut.classList.remove('snap'); void zoomOut.offsetWidth; zoomOut.classList.add('snap');
      }
    }
    setZoom(Math.exp(s * LOGMAX)); used();
  });
  /* 图标的小动作：点一下弹一弹，"还原"和"翻转"会转一圈 */
  var turns = { reset: 0, flip: 0 };
  function nudge(btn){
    var svg = btn.querySelector('svg');
    if (!svg || calm) return;
    if (btn.id === 'reset') { turns.reset -= 360; svg.style.transform = 'rotate(' + turns.reset + 'deg)'; return; }
    if (btn.id === 'flip') { turns.flip += 180; svg.style.transform = 'rotate(' + turns.flip + 'deg)'; return; }
    svg.classList.remove('bump'); void svg.getBoundingClientRect(); svg.classList.add('bump');
  }
  $('reset').addEventListener('click', function(){ haptic(); nudge(this); lastTick = 0; setZoom(1, 0, 0, true); });
  window.addEventListener('resize', remeasure);

  /* ================= 摄像头 ================= */
  function stop(){
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null; track = null; torch = false; canTorch = false;
  }
  function fail(name){
    var t = '需要打开摄像头', m;
    if (name === 'insecure') {
      t = '这样打开用不了摄像头';
      m = '请通过 https 开头的网址打开这个页面。直接打开文件时，浏览器不允许使用摄像头。';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      m = '镜子需要用到摄像头。请点下面的按钮并选择“允许”。如果没有弹出询问，到“设置”里找到 Safari 浏览器 → 相机，改成“允许”。';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      t = '没有找到摄像头';
      m = '这台设备上没有可用的摄像头，或者它正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    } else {
      t = '摄像头没有打开';
      m = '可能正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    }
    $('msgTitle').textContent = t;
    $('msgText').textContent = m;
    $('msg').hidden = false;
    sleep(true);
  }
  var blink = $('blink');
  function setFrozen(on, byHand){
    frozen = on;
    $('freeze').setAttribute('aria-pressed', String(on));
    $('freezeLabel').textContent = on ? '继续' : '定格';
    stateChip.hidden = !on;
    if (on) {
      hint.hidden = true;
      v.pause(); clonesPlay(false);
      if (byHand && !calm) { blink.classList.remove('go'); void blink.offsetWidth; blink.classList.add('go'); }
    } else {
      var p = v.play(); if (p && p.catch) p.catch(function(){});
      if (!quiet) clonesPlay(true);
    }
  }
  var settleTimer = null;
  function setLamp(level){
    lampLevel = level;
    body.classList.toggle('lamp', level > 0);
    body.classList.toggle('lamp2', level === 2);
    /* 镜面正在变大小的这一小会儿，先不显示边缘折光，等它停稳再对齐 */
    body.classList.add('settling');
    box = null;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      remeasure();
      body.classList.remove('settling');
      readTones(true);
    }, 320);
    syncLampButton();
    wake();
  }
  function syncLampButton(){
    var useTorch = facing === 'environment' && canTorch;
    $('lampLabel').textContent = useTorch ? '手电' : (lampLevel === 2 ? '强光' : '补光');
    $('lamp').setAttribute('aria-pressed', String(useTorch ? torch : lampLevel > 0));
  }
  async function start(){
    if (starting) return;
    starting = true;
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      starting = false; fail('insecure'); return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } }
      });
    } catch (err) {
      starting = false; fail(err && err.name); return;
    }
    $('msg').hidden = true;
    track = stream.getVideoTracks()[0];
    var caps = (track.getCapabilities && track.getCapabilities()) || {};
    canTorch = !!caps.torch;
    mirrored = facing === 'user';
    [v].concat(clones).forEach(function(el){
      el.classList.toggle('mirror', mirrored);
      el.srcObject = stream;
    });
    setFrozen(false);
    $('flipLabel').textContent = facing === 'user' ? '后置' : '前置';
    if (facing === 'environment' && canTorch && lampLevel) setLamp(0);
    syncLampButton();
    apply();
    keepAwake();
    measureGlass();
    wake();
    starting = false;
  }

  $('retry').addEventListener('click', start);
  $('freeze').addEventListener('click', function(){ haptic(); setFrozen(!frozen, true); used(); });
  $('flip').addEventListener('click', function(){
    haptic(); nudge(this);
    facing = facing === 'user' ? 'environment' : 'user';
    start();
  });
  $('boost').addEventListener('click', function(){
    haptic(); nudge(this);
    boostOn = body.classList.toggle('boost');
    this.setAttribute('aria-pressed', String(boostOn));
    setTimeout(function(){ readTones(true); }, 60);
  });
  $('lamp').addEventListener('click', function(){
    haptic(); nudge(this);
    if (facing === 'environment' && canTorch && track) {
      torch = !torch;
      track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function(){ torch = false; syncLampButton(); });
      syncLampButton();
    } else {
      setLamp((lampLevel + 1) % 3);   /* 关 → 补光 → 强光 → 关 */
    }
  });

  /* 屏幕常亮，免得检查到一半自动锁屏 */
  function keepAwake(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').catch(function(){});
  }
  /* 从后台回来时，摄像头常常已被系统停掉，重新打开 */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    keepAwake();
    kick();
    if (frozen) return;
    if (!track || track.readyState !== 'live' || track.muted) { start(); return; }
    if (!quiet) clonesPlay(true);
  });

  /* ---------- 体检 ---------- */
  /* 按住右下角的倍数一秒多，屏幕上方会出现一行数字，持续十几秒：摄像头给的画面有多大、每秒实际多少帧、
     界面每秒多少帧。觉得卡的时候把这行字截图下来，就能知道卡在哪一环。平时不运行，不占力气 */
  var diag = $('diag'), holdTimer = null, dg = null;
  zoomOut.addEventListener('pointerdown', function(){ clearTimeout(holdTimer); holdTimer = setTimeout(startDiag, 1100); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(t){
    zoomOut.addEventListener(t, function(){ clearTimeout(holdTimer); });
  });
  function startDiag(){
    if (dg) return;
    haptic();
    dg = { ui: 0, cam: 0, t0: null, left: 14 };
    diag.hidden = false; diag.textContent = '正在测量…';
    var hasCb = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
    var onCam = function(){ if (!dg) return; dg.cam++; v.requestVideoFrameCallback(onCam); };
    if (hasCb) v.requestVideoFrameCallback(onCam);
    var onUi = function(now){
      if (!dg) return;
      if (dg.t0 === null) dg.t0 = now;
      dg.ui++;
      if (now - dg.t0 >= 1000) {
        var sec = (now - dg.t0) / 1000, st = (track && track.getSettings && track.getSettings()) || {};
        diag.textContent = '摄像头 ' + v.videoWidth + '×' + v.videoHeight +
          (st.frameRate ? '（设定每秒 ' + Math.round(st.frameRate) + ' 帧）' : '') +
          ' · 画面' + (frozen ? '已定格' : '实际每秒 ' + (hasCb ? Math.round(dg.cam / sec) : '?') + ' 帧') +
          ' · 界面每秒 ' + Math.round(dg.ui / sec) + ' 帧' +
          ' · 按钮' + (quiet ? '收起' : '显示') +
          ' · 屏幕 ' + window.innerWidth + '×' + window.innerHeight + '@' + (window.devicePixelRatio || 1) +
          ' · 第 ' + VER + ' 版';
        dg.ui = 0; dg.cam = 0; dg.t0 = now;
        if (--dg.left <= 0) { dg = null; diag.hidden = true; return; }
      }
      requestAnimationFrame(onUi);
    };
    requestAnimationFrame(onUi);
  }

  /* 有新版本时自己换上：手机发现新版本后页面自动重新载入一次，不用再手动关掉重开两遍 */
  if ('serviceWorker' in navigator) {
    var hadWorker = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadWorker || reloaded) return;
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      /* 每次打开、每次从后台回来，都主动问一次有没有新版本 */
      var ask = function(){ try { reg.update().catch(function(){}); } catch (_) {} };
      ask();
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') ask();
      });
    }).catch(function(){});
  }

  apply();
  measureGlass();
  setTimeout(measureGlass, 600);
  start();
})();
</script>
</body>
</html>
