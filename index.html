<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>放大镜子</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="镜子">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 布局：整屏都是镜面。画面只有一层，摄像头给什么就显示什么，中间不加任何效果。
   按钮没有底板，直接浮在画面上；不用时淡出，点一下画面再出现 */
:root{
  --ink:#0a0e0f;            /* 略偏青的黑 */
  --fg:#ffffff;
  --dim:#c3cfcc;
  --mint:#7ff0cf;           /* 唯一的强调色：只用在"开着"的东西上 */
  --lamp:#ffffff;           /* 补光用纯白，最亮 */
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{
  position:fixed;inset:0;color:var(--fg);font:15px/1.4 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  /* 按钮的颜色：平时白色带一点阴影，在任何画面上都看得清；补光的白底上换成深色 */
  --on:#ffffff; --act:var(--mint); --track:rgba(255,255,255,.42);
  --shade:0 0 1px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3);
  --ishade:drop-shadow(0 0 1px rgba(0,0,0,.5)) drop-shadow(0 1px 3px rgba(0,0,0,.45));
  --lift:0 0 0 .5px rgba(0,0,0,.2),0 1px 5px rgba(0,0,0,.4);
}
body.lamp{ --on:#0a0e0f; --act:#0a7d68; --track:rgba(10,14,15,.18); --shade:none; --ishade:none; --lift:none; }

#frame{position:fixed;inset:0;background:#000;transition:background .25s}
#stage{
  position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;
  transition:inset .25s,border-radius .25s;
}
#pan{position:absolute;inset:0;transform-origin:50% 50%}
video{display:block;width:100%;height:100%;object-fit:cover}
video.mirror{transform:scaleX(-1)}
/* 提亮：在画面上面盖一层只调亮度的透明片。它作用在已经放大好的画面上，所以不会损失清晰度；不开的时候这一层不存在 */
#boostLayer{
  position:absolute;inset:0;pointer-events:none;
  -webkit-backdrop-filter:brightness(1.4) contrast(1.08);backdrop-filter:brightness(1.4) contrast(1.08);
}

/* 补光：画面缩成一个窗口，其余整块屏幕发白光。强光时窗口更小，白光面积更大 */
.lamp #frame{background:var(--lamp)}
.lamp #stage{
  inset:calc(env(safe-area-inset-top,0px) + 64px) 30px calc(env(safe-area-inset-bottom,0px) + 200px);
  border-radius:34px;
}
.lamp2 #stage{
  inset:calc(env(safe-area-inset-top,0px) + 20vh) 17vw calc(env(safe-area-inset-bottom,0px) + 36vh);
  border-radius:40px;
}

/* ---------- 顶部的两句话 ---------- */
#top{
  position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.note{padding:6px 13px;border-radius:999px;font-size:13px;background:rgba(0,0,0,.46);color:#fff}
#hint{transition:opacity .3s}
.quiet #hint,#hint.gone{opacity:0}
#state{background:var(--mint);color:#06352c;font-weight:600}
#diag{font-size:11px;line-height:1.5;border-radius:14px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- 底部的按钮 ---------- */
/* 按钮出现时，画面最下面有一层很淡的由浅到深的阴影，白色的按钮在白牙齿前面也看得清；按钮收起后它也跟着消失 */
#shade{
  position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 250px);pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.08) 34%,rgba(0,0,0,.22) 62%,rgba(0,0,0,.38));
  transition:opacity .3s;
}
.quiet #shade,.lamp #shade{opacity:0}
#bar{
  position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;gap:8px;color:var(--on);text-shadow:var(--shade);
  transition:opacity .3s,visibility 0s;
}
.quiet #bar{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s .3s}

#zoomrow{display:flex;align-items:center;gap:12px;padding:0 6px}
#zoomOut{flex:none;min-width:50px;text-align:right;font:600 16px/1 var(--ui);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent;
  color:inherit;touch-action:none;--t:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;box-shadow:var(--lift);
  background:linear-gradient(90deg,currentColor calc(13px + (100% - 26px) * var(--t)),var(--track) 0);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;margin-top:-11.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:currentColor}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}

.tools{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;justify-items:center}
.tool{
  display:grid;justify-items:center;gap:4px;min-width:58px;padding:8px 4px;
  border:0;background:transparent;color:inherit;text-shadow:inherit;
  font:500 12px/1.2 var(--ui);letter-spacing:.02em;transition:color .2s,opacity .12s;
}
.tool svg{
  width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:var(--ishade);
}
.tool svg .fill{fill:currentColor;stroke:none}
.tool:active{opacity:.5}
.tool[aria-pressed=true]{color:var(--act)}

/* 快门：一个圆环套一颗圆片 */
#freeze{
  width:70px;height:70px;margin:0 10px;padding:0;border-radius:50%;
  border:3px solid var(--on);background:transparent;box-shadow:var(--lift);
  display:grid;place-items:center;font:600 13px/1 var(--ui);letter-spacing:.02em;
}
#freeze span{
  display:grid;place-items:center;width:56px;height:56px;border-radius:50%;
  background:var(--on);color:#0a0e0f;text-shadow:none;transition:transform .15s,background .2s;
}
.lamp #freeze span{color:#fff}
#freeze:active span{transform:scale(.9)}
#freeze[aria-pressed=true] span{background:var(--act);color:#06352c}
.lamp #freeze[aria-pressed=true] span{color:#fff}

button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:3px}

#msg{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;
  padding:32px;text-align:center;background:var(--ink);color:var(--fg);
}
#msg h1{margin:0;font:600 22px/1.3 var(--ui)}
#msg p{margin:0;max-width:22em;color:var(--dim);line-height:1.7}
#retry{
  border:0;border-radius:999px;padding:13px 28px;background:var(--mint);color:var(--ink);
  font:600 16px/1 var(--ui);
}
@media (prefers-reduced-motion:reduce){
  #stage,#frame,#bar,.quiet #bar,#shade,#hint,.tool,#freeze span{transition:none}
}
</style>
</head>
<body class="quiet">
<div id="frame">
  <div id="stage">
    <div id="pan"><video id="v" class="mirror" playsinline autoplay muted></video></div>
    <div id="boostLayer" hidden></div>
  </div>
</div>

<div id="top">
  <span class="note" id="hint">双指放大 · 拖动移动 · 点一下画面收起按钮</span>
  <span class="note" id="state" hidden>已定格</span>
  <span class="note" id="diag" hidden></span>
</div>

<div id="shade"></div>
<div id="bar">
  <div id="zoomrow">
    <input id="zoom" type="range" min="0" max="1" step="0.001" value="0" aria-label="放大倍数">
    <output id="zoomOut" for="zoom" aria-live="polite">1.0×</output>
  </div>
  <div class="tools">
    <button class="tool" id="lamp" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.9"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.35 5.35l1.65 1.65M17 17l1.65 1.65M5.35 18.65 7 17M17 7l1.65-1.65"/></svg>
      <span id="lampLabel">补光</span>
    </button>
    <button class="tool" id="boost" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3"/><path class="fill" d="M12 5.6a6.4 6.4 0 0 1 0 12.8z"/></svg>
      <span>提亮</span>
    </button>
    <button id="freeze" type="button" aria-pressed="false" aria-label="定格画面"><span id="freezeLabel">定格</span></button>
    <button class="tool" id="reset" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.7 6v4.6h4.6"/><path d="M5.6 14.5a7 7 0 1 0 1.65-7.25L3.7 10.6"/></svg>
      <span>还原</span>
    </button>
    <button class="tool" id="flip" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 5.8v4.6H16M3.4 18.2v-4.6H8"/><path d="M5.4 9.7a7 7 0 0 1 11.6-2.6l3.6 3.3M3.4 13.6 7 17a7 7 0 0 0 11.6-2.7"/></svg>
      <span id="flipLabel">后置</span>
    </button>
  </div>
</div>

<div id="msg" hidden>
  <h1 id="msgTitle">需要打开摄像头</h1>
  <p id="msgText"></p>
  <button id="retry" type="button">打开摄像头</button>
</div>

<script>
(function(){
  'use strict';
  var VER = 9;
  var $ = function(id){ return document.getElementById(id); };
  var body = document.body;
  var v = $('v'), stage = $('stage'), pan = $('pan'), bar = $('bar');
  var zoomEl = $('zoom'), zoomOut = $('zoomOut'), hint = $('hint');
  var ZMAX = 100;                 /* 100 倍时屏幕上只剩十几个像素点，再大没有意义 */
  var LOGMAX = Math.log(ZMAX);
  var z = 1, tx = 0, ty = 0;
  var facing = 'user', stream = null, track = null;
  var frozen = false, torch = false, canTorch = false, starting = false;
  var lampLevel = 0;              /* 0 关，1 补光，2 强光 */
  var calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

  /* ================= 镜面：放大与移动 ================= */
  var box = null, painting = 0, shownZoom = '';
  /* 镜面的位置和大小只在变化时量一次，手指移动时不再反复去量 */
  function origin(){
    if (!box) {
      var r = stage.getBoundingClientRect();
      box = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    }
    return box;
  }
  function paint(){
    painting = 0;
    pan.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + z + ')';
    var label = (z < 10 ? z.toFixed(1) : Math.round(z)) + '×';
    if (label !== shownZoom) { zoomOut.textContent = shownZoom = label; }
    var s = Math.log(z) / LOGMAX;          /* 滑杆按倍数均匀分布：1、3、10、30、100 间隔相等 */
    zoomEl.value = s;
    zoomEl.style.setProperty('--t', s.toFixed(4));   /* 滑杆左边亮起的一段 */
  }
  /* 每一帧屏幕最多重画一次，手指动得再快也不会堆积 */
  function apply(){
    var o = origin();
    var mx = o.w * (z - 1) / 2, my = o.h * (z - 1) / 2;
    tx = clamp(tx, -mx, mx); ty = clamp(ty, -my, my);
    if (!painting) painting = requestAnimationFrame(paint);
  }
  /* 以 (cx,cy) 为中心缩放，坐标相对镜面中心。smooth 时用 0.22 秒滑过去 */
  var tw = null;
  function tweenStep(now){
    if (!tw) return;
    if (tw.t0 === null) tw.t0 = now;
    var u = calm ? 1 : clamp((now - tw.t0) / 220, 0, 1), e = 1 - Math.pow(1 - u, 3);
    var nz = tw.z0 * Math.pow(tw.z1 / tw.z0, e), k = nz / tw.z0;
    tx = tw.cx - (tw.cx - tw.tx0) * k; ty = tw.cy - (tw.cy - tw.ty0) * k; z = nz;
    apply();
    if (u < 1) requestAnimationFrame(tweenStep); else tw = null;
  }
  function setZoom(nz, cx, cy, smooth){
    nz = clamp(nz, 1, ZMAX);
    cx = cx || 0; cy = cy || 0;
    if (smooth) {
      tw = { z0: z, z1: nz, tx0: tx, ty0: ty, cx: cx, cy: cy, t0: null };
      requestAnimationFrame(tweenStep);
      return;
    }
    tw = null;
    var k = nz / z;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; z = nz;
    apply();
  }
  /* 提示只在第一次使用时出现 */
  try { if (localStorage.getItem('mirrorHintSeen')) hint.hidden = true; } catch (_) {}
  function used(){
    hint.classList.add('gone');
    try { localStorage.setItem('mirrorHintSeen', '1'); } catch (_) {}
  }

  /* ================= 按钮：显示与收起 ================= */
  /* 3.5 秒不碰就淡出；补光开着时按钮不在画面上，就一直留着 */
  var quiet = true, quietTimer = null;
  function canHide(){ return lampLevel === 0 && $('msg').hidden; }
  function wake(){
    clearTimeout(quietTimer);
    quietTimer = setTimeout(sleep, 3500);
    if (!quiet) return;
    quiet = false; body.classList.remove('quiet');
  }
  function sleep(force){
    clearTimeout(quietTimer);
    if (quiet || (force !== true && !canHide())) return;
    quiet = true; body.classList.add('quiet');
  }
  ['pointerdown', 'pointermove', 'input', 'click'].forEach(function(t){ bar.addEventListener(t, wake); });

  /* ================= 手势 ================= */
  var pts = new Map(), g = null, tapTimer = null, multi = false;
  function begin(){
    var a = Array.from(pts.values()), o = origin();
    if (a.length === 1) {
      g = { n: 1, x: a[0][0], y: a[0][1], tx: tx, ty: ty, moved: false };
    } else if (a.length >= 2) {
      g = { n: 2,
            d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1,
            mx: (a[0][0] + a[1][0]) / 2 - o.x, my: (a[0][1] + a[1][1]) / 2 - o.y,
            z: z, tx: tx, ty: ty };
    } else { g = null; }
  }
  stage.addEventListener('pointerdown', function(e){
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size >= 2) multi = true;      /* 用过两根手指的这一次，抬手时不算"点了一下" */
    tw = null;
    begin();
  });
  stage.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    var a = Array.from(pts.values()), o = origin();
    if (g.n === 1 && a.length === 1) {
      var dx = a[0][0] - g.x, dy = a[0][1] - g.y;
      if (!g.moved && Math.hypot(dx, dy) > 8) { g.moved = true; sleep(); }
      if (g.moved) { tx = g.tx + dx; ty = g.ty + dy; apply(); }
    } else if (g.n === 2 && a.length >= 2) {
      var d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
      var mx = (a[0][0] + a[1][0]) / 2 - o.x, my = (a[0][1] + a[1][1]) / 2 - o.y;
      var nz = clamp(g.z * d / g.d, 1, ZMAX), k = nz / g.z;
      tx = mx - (g.mx - g.tx) * k; ty = my - (g.my - g.ty) * k; z = nz;
      apply(); used(); sleep();
    }
  });
  function end(e){
    if (!pts.has(e.pointerId)) return;
    var tap = g && g.n === 1 && !g.moved && !multi && e.type === 'pointerup';
    pts.delete(e.pointerId);
    if (pts.size === 0) multi = false;
    begin();
    if (!tap) return;
    if (tapTimer) {                       /* 第二下：双击放大 */
      clearTimeout(tapTimer); tapTimer = null;
      var o = origin();
      setZoom(z > 1.05 ? 1 : 3, e.clientX - o.x, e.clientY - o.y, true);
      used();
    } else {                              /* 只点了一下：收起或显示按钮 */
      tapTimer = setTimeout(function(){
        tapTimer = null;
        if (quiet) wake(); else sleep();
      }, 280);
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  /* 阻止 Safari 自己的整页缩放 */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
  });

  zoomEl.addEventListener('input', function(){
    setZoom(Math.exp(parseFloat(zoomEl.value) * LOGMAX)); used();
  });
  $('reset').addEventListener('click', function(){ setZoom(1, 0, 0, true); });
  window.addEventListener('resize', function(){ box = null; apply(); });

  /* ================= 摄像头 ================= */
  function stop(){
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null; track = null; torch = false; canTorch = false;
  }
  function fail(name){
    var t = '需要打开摄像头', m;
    if (name === 'insecure') {
      t = '这样打开用不了摄像头';
      m = '请通过 https 开头的网址打开这个页面。直接打开文件时，浏览器不允许使用摄像头。';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      m = '镜子需要用到摄像头。请点下面的按钮并选择“允许”。如果没有弹出询问，到“设置”里找到 Safari 浏览器 → 相机，改成“允许”。';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      t = '没有找到摄像头';
      m = '这台设备上没有可用的摄像头，或者它正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    } else {
      t = '摄像头没有打开';
      m = '可能正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    }
    $('msgTitle').textContent = t;
    $('msgText').textContent = m;
    $('msg').hidden = false;
    sleep(true);
  }
  function setFrozen(on){
    frozen = on;
    $('freeze').setAttribute('aria-pressed', String(on));
    $('freezeLabel').textContent = on ? '继续' : '定格';
    $('state').hidden = !on;
    if (on) { hint.hidden = true; v.pause(); return; }
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  }
  var settleTimer = null;
  function setLamp(level){
    lampLevel = level;
    body.classList.toggle('lamp', level > 0);
    body.classList.toggle('lamp2', level === 2);
    box = null;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){ box = null; apply(); }, 320);   /* 镜面大小变完了，重新量一次 */
    syncLampButton();
    wake();
  }
  function syncLampButton(){
    var useTorch = facing === 'environment' && canTorch;
    $('lampLabel').textContent = useTorch ? '手电' : (lampLevel === 2 ? '强光' : '补光');
    $('lamp').setAttribute('aria-pressed', String(useTorch ? torch : lampLevel > 0));
  }
  async function start(){
    if (starting) return;
    starting = true;
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      starting = false; fail('insecure'); return;
    }
    try {
      /* 向摄像头要它能给的最高画质 */
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } }
      });
    } catch (err) {
      starting = false; fail(err && err.name); return;
    }
    $('msg').hidden = true;
    track = stream.getVideoTracks()[0];
    var caps = (track.getCapabilities && track.getCapabilities()) || {};
    canTorch = !!caps.torch;
    v.classList.toggle('mirror', facing === 'user');
    v.srcObject = stream;
    setFrozen(false);
    $('flipLabel').textContent = facing === 'user' ? '后置' : '前置';
    if (facing === 'environment' && canTorch && lampLevel) setLamp(0);
    syncLampButton();
    apply();
    keepAwake();
    wake();
    starting = false;
  }

  $('retry').addEventListener('click', start);
  $('freeze').addEventListener('click', function(){ setFrozen(!frozen); used(); });
  $('flip').addEventListener('click', function(){
    facing = facing === 'user' ? 'environment' : 'user';
    start();
  });
  $('boost').addEventListener('click', function(){
    var on = $('boostLayer').hidden;
    $('boostLayer').hidden = !on;
    this.setAttribute('aria-pressed', String(on));
  });
  $('lamp').addEventListener('click', function(){
    if (facing === 'environment' && canTorch && track) {
      torch = !torch;
      track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function(){ torch = false; syncLampButton(); });
      syncLampButton();
    } else {
      setLamp((lampLevel + 1) % 3);   /* 关 → 补光 → 强光 → 关 */
    }
  });

  /* 屏幕常亮，免得检查到一半自动锁屏 */
  function keepAwake(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').catch(function(){});
  }
  /* 从后台回来时，摄像头常常已被系统停掉，重新打开 */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    keepAwake();
    if (frozen) return;
    if (!track || track.readyState !== 'live' || track.muted) start();
  });

  /* ---------- 体检 ---------- */
  /* 按住右下角的倍数一秒多，屏幕上方会出现一行数字，持续十几秒：摄像头给的画面有多大、每秒实际多少帧、
     界面每秒多少帧。觉得不清楚或者卡的时候，把这行字截图下来，就能知道问题出在哪一环。平时不运行 */
  var diag = $('diag'), holdTimer = null, dg = null;
  zoomOut.addEventListener('pointerdown', function(){ clearTimeout(holdTimer); holdTimer = setTimeout(startDiag, 1100); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(t){
    zoomOut.addEventListener(t, function(){ clearTimeout(holdTimer); });
  });
  function startDiag(){
    if (dg) return;
    dg = { ui: 0, cam: 0, t0: null, left: 14 };
    diag.hidden = false; diag.textContent = '正在测量…';
    var hasCb = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
    var onCam = function(){ if (!dg) return; dg.cam++; v.requestVideoFrameCallback(onCam); };
    if (hasCb) v.requestVideoFrameCallback(onCam);
    var onUi = function(now){
      if (!dg) return;
      if (dg.t0 === null) dg.t0 = now;
      dg.ui++;
      if (now - dg.t0 >= 1000) {
        var sec = (now - dg.t0) / 1000, st = (track && track.getSettings && track.getSettings()) || {};
        diag.textContent = '摄像头 ' + v.videoWidth + '×' + v.videoHeight +
          (st.frameRate ? '（设定每秒 ' + Math.round(st.frameRate) + ' 帧）' : '') +
          ' · 画面' + (frozen ? '已定格' : '实际每秒 ' + (hasCb ? Math.round(dg.cam / sec) : '?') + ' 帧') +
          ' · 界面每秒 ' + Math.round(dg.ui / sec) + ' 帧' +
          ' · 屏幕 ' + window.innerWidth + '×' + window.innerHeight + '@' + (window.devicePixelRatio || 1) +
          ' · 第 ' + VER + ' 版';
        dg.ui = 0; dg.cam = 0; dg.t0 = now;
        if (--dg.left <= 0) { dg = null; diag.hidden = true; return; }
      }
      requestAnimationFrame(onUi);
    };
    requestAnimationFrame(onUi);
  }

  /* 有新版本时自己换上：手机发现新版本后页面自动重新载入一次 */
  if ('serviceWorker' in navigator) {
    var hadWorker = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadWorker || reloaded) return;
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      /* 每次打开、每次从后台回来，都主动问一次有没有新版本 */
      var ask = function(){ try { reg.update().catch(function(){}); } catch (_) {} };
      ask();
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') ask();
      });
    }).catch(function(){});
  }

  apply();
  start();
})();
</script>
</body>
</html>
