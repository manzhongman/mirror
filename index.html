<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>放大镜子</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="镜子">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 布局：整屏都是镜面；按钮是浮在画面上的几块透明玻璃。
   不用时玻璃缩回快门里消失，点一下画面再从快门里分出来 */
:root{
  --ink:#0a0e0f;            /* 略偏青的黑 */
  --fg:#f7fbfa;
  --dim:#c3cfcc;
  --mint:#7ff0cf;
  --lamp:#ffffff;           /* 补光用纯白，最亮 */
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}
body{
  position:fixed;inset:0;color:var(--fg);font:15px/1.4 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  /* 玻璃上的字和图标：默认白色；背后画面亮时换成深色（见 .ink） */
  --on:var(--fg); --on-inv:var(--ink); --act:var(--mint);
  --track:rgba(255,255,255,.36);
  --shade:0 0 1px rgba(0,0,0,.30),0 1px 4px rgba(0,0,0,.38);
  --ishade:drop-shadow(0 1px 2.5px rgba(0,0,0,.45));
}
body.lamp{ --on:#0a0e0f; --on-inv:#ffffff; --act:#0a7d68; --track:rgba(10,14,15,.16); --shade:none; --ishade:none; }

#frame{position:fixed;inset:0;background:#000;transition:background .25s}
#stage{
  position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;
  transition:inset .25s,border-radius .25s;
}
#pan{position:absolute;inset:0;transform-origin:50% 50%}
video{display:block;width:100%;height:100%;object-fit:cover}
video.mirror{transform:scaleX(-1)}
.boost video{filter:brightness(1.4) contrast(1.08)}

/* 补光：画面缩成一个窗口，其余整块屏幕发白光。强光时窗口更小，白光面积更大 */
.lamp #frame{background:var(--lamp)}
.lamp #stage{
  inset:calc(env(safe-area-inset-top,0px) + 64px) 30px calc(env(safe-area-inset-bottom,0px) + 212px);
  border-radius:34px;
}
.lamp2 #stage{
  inset:calc(env(safe-area-inset-top,0px) + 20vh) 17vw calc(env(safe-area-inset-bottom,0px) + 36vh);
  border-radius:40px;
}

/* ---------- 液态玻璃 ---------- */
/* 玻璃中间是通透的，直接看到后面的画面。边缘那一圈"折光"是另一份同样的摄像头画面，稍微放大后只露出边上一圈。
   这些全部交给手机的图形系统去合成，页面自己不逐帧计算，所以不卡。 */
.glass{
  position:relative;border-radius:999px;
  color:var(--on);text-shadow:var(--shade);transition:color .3s,background-color .3s;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.02) 46%,rgba(255,255,255,.08));
  box-shadow:0 10px 26px rgba(0,0,0,.20),0 2px 5px rgba(0,0,0,.14);
}
/* 手指按着的地方，玻璃从里面亮起来 */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(72px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.36),rgba(255,255,255,0) 72%);
}
.glass.pressed::before{opacity:1}
/* 一圈边缘光：左上最亮，右下有一道回光 */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.96),rgba(255,255,255,.24) 30%,rgba(255,255,255,.10) 62%,rgba(255,255,255,.72));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* 边缘折光的那一圈 */
.lens{
  position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
}
.lens::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 42%,rgba(255,255,255,.18));
}
.world{position:absolute}
.panc{position:absolute;inset:0;transform-origin:50% 50%}
/* 背后画面亮（比如正对着牙齿）：这块玻璃略微提亮一点 */
.glass.bright{background-color:rgba(255,255,255,.22)}
/* 白光背景上的玻璃：浅色的薄片，不需要折光 */
.lamp .glass{
  background:linear-gradient(180deg,rgba(10,14,15,.02),rgba(10,14,15,.06));
  box-shadow:inset 0 1.5px 1px #fff,inset 0 0 0 1px rgba(10,14,15,.07),0 8px 20px rgba(10,14,15,.10);
}
.lamp .glass::after,.lamp .lens,.settling .lens{display:none}

#top{
  position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);
  display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none;
}
.chip{padding:7px 14px;font-size:13px;letter-spacing:.01em;transition:opacity .35s,color .3s}
#hint{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(12,16,17,.30)}
.quiet #hint,#hint.gone{opacity:0}
#state{color:#06352c;text-shadow:none;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),rgba(127,240,207,.88)}

#bar{
  position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;gap:12px;visibility:hidden;
}
.quiet #bar{pointer-events:none}

#zoomrow{display:flex;align-items:center;gap:12px;padding:4px 18px 4px 12px}
#zoomOut{position:relative;transition:color .3s;flex:none;min-width:48px;text-align:right;font:600 15px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.rail{position:relative;flex:1;min-width:0;display:flex;transition:color .3s}
/* 刻度：1、2、5、10、20、50、100 倍，像镜头对焦环上的标记 */
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks i{
  position:absolute;top:calc(50% + 9px);left:calc(18px + (100% - 36px) * var(--k));
  width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.6;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:42px;margin:0;background:transparent;
  color:inherit;touch-action:none;--t:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  background:linear-gradient(90deg,currentColor calc(18px + (100% - 36px) * var(--t)),var(--track) 0);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:36px;height:24px;margin-top:-10px;border-radius:12px;
  background:linear-gradient(180deg,#ffffff,#eef2f1);
  box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(0,0,0,.30),0 0 0 .5px rgba(0,0,0,.10);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:currentColor}
input[type=range]::-moz-range-thumb{width:36px;height:24px;border:0;border-radius:12px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.30)}

.tools{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.group{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.tool{
  position:relative;display:grid;justify-items:center;gap:3px;min-width:0;padding:8px 2px 7px;
  border:0;border-radius:999px;background:transparent;
  color:inherit;text-shadow:inherit;font:500 11.5px/1.2 var(--ui);
  transition:color .3s,background .25s,box-shadow .25s,transform .3s cubic-bezier(.3,1.6,.5,1);
}
.tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:var(--ishade)}
.tool:active{transform:scale(1.08)}
/* 背后画面亮的地方，字和图标换成深色，和苹果的玻璃一样会自己变。每个按钮各看各的背后 */
.ink{ --on:#0a0e0f; --track:rgba(10,14,15,.22); --shade:none; --ishade:none; color:var(--on); text-shadow:none }
/* 开着的功能：玻璃里再浮起一小片薄荷色玻璃 */
.tool[aria-pressed=true]{
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.04) 56%),rgba(74,222,184,.66);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.9),inset 0 0 0 1px rgba(190,255,238,.5),0 3px 12px rgba(20,120,95,.30);
}
.lamp .tool[aria-pressed=true]{
  color:var(--act);background:rgba(10,125,104,.12);
  box-shadow:inset 0 0 0 1px rgba(10,125,104,.30);
}
#freeze{
  width:76px;height:76px;padding:0;border:0;display:grid;place-items:center;font:600 13px/1 var(--ui);
}
#freeze span{
  position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;
  color:#0a0e0f;text-shadow:none;
  background:linear-gradient(180deg,#ffffff,#e9eeed);
  box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(0,0,0,.25);
  transition:background .2s,transform .3s cubic-bezier(.3,1.6,.5,1);
}
#freeze:active span{transform:scale(.9)}
.lamp #freeze span{background:#0a0e0f;color:#fff;box-shadow:0 2px 8px rgba(10,14,15,.25)}
#freeze[aria-pressed=true] span{background:linear-gradient(180deg,#b6f8e4,#63dcb9);color:#06352c}

button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:3px}

#msg{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;
  padding:32px;text-align:center;background:var(--ink);color:var(--fg);
}
#msg h1{margin:0;font:600 22px/1.3 var(--ui)}
#msg p{margin:0;max-width:22em;color:var(--dim);line-height:1.7}
#retry{
  border:0;border-radius:999px;padding:13px 28px;background:var(--mint);color:var(--ink);
  font:600 16px/1 var(--ui);
}
@media (prefers-reduced-motion:reduce){
  #stage,#frame,.glass,.tool,.chip,#freeze span{transition:none}
}
</style>
</head>
<body class="quiet">
<div id="frame">
  <div id="stage"><div id="pan"><video id="v" class="mirror" playsinline autoplay muted></video></div></div>
</div>

<div id="top">
  <span class="chip glass" id="hint">双指放大 · 拖动移动 · 点一下画面收起按钮</span>
  <span class="chip glass" id="state" hidden>已定格</span>
</div>

<div id="bar">
  <div class="glass live" id="zoomrow">
    <div class="rail">
      <div class="ticks" aria-hidden="true"><i style="--k:0"></i><i style="--k:.1505"></i><i style="--k:.3495"></i><i style="--k:.5"></i><i style="--k:.6505"></i><i style="--k:.8495"></i><i style="--k:1"></i></div>
      <input id="zoom" type="range" min="0" max="1" step="0.001" value="0" aria-label="放大倍数">
    </div>
    <output id="zoomOut" for="zoom" aria-live="polite">1.0×</output>
  </div>
  <div class="tools">
    <div class="group glass live" id="groupL">
      <button class="tool" id="lamp" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
        <span id="lampLabel">补光</span>
      </button>
      <button class="tool" id="boost" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 7.5h6.4M12 12h8.5M12 16.5h6.4"/></svg>
        <span>提亮</span>
      </button>
    </div>
    <button id="freeze" class="glass live" type="button" aria-pressed="false" aria-label="定格画面"><span id="freezeLabel">定格</span></button>
    <div class="group glass live" id="groupR">
      <button class="tool" id="reset" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg>
        <span>还原</span>
      </button>
      <button class="tool" id="flip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h13.5l-3-3M20 15.5H6.5l3 3"/></svg>
        <span id="flipLabel">后置</span>
      </button>
    </div>
  </div>
</div>

<div id="msg" hidden>
  <h1 id="msgTitle">需要打开摄像头</h1>
  <p id="msgText"></p>
  <button id="retry" type="button">打开摄像头</button>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var body = document.body;
  var v = $('v'), stage = $('stage'), pan = $('pan'), bar = $('bar');
  var zoomEl = $('zoom'), zoomOut = $('zoomOut'), hint = $('hint'), stateChip = $('state');
  var ZMAX = 100;                 /* 100 倍时屏幕上只剩十几个像素点，再大没有意义 */
  var LOGMAX = Math.log(ZMAX);
  var z = 1, tx = 0, ty = 0;
  var facing = 'user', mirrored = true, stream = null, track = null;
  var frozen = false, torch = false, canTorch = false, starting = false, boostOn = false;
  var lampLevel = 0;              /* 0 关，1 补光，2 强光 */
  var calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

  /* ================= 镜面：放大与移动 ================= */
  var box = null, painting = 0, shownZoom = '';
  /* 镜面的位置和大小只在变化时量一次，手指移动时不再反复去量 */
  function origin(){
    if (!box) {
      var r = stage.getBoundingClientRect();
      box = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    }
    return box;
  }
  function paint(){
    painting = 0;
    pan.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + z + ')';
    var label = (z < 10 ? z.toFixed(1) : Math.round(z)) + '×';
    if (label !== shownZoom) { zoomOut.textContent = shownZoom = label; }
    zoomEl.value = Math.log(z) / LOGMAX;   /* 滑杆按倍数均匀分布：1、3、10、30、100 间隔相等 */
    zoomEl.style.setProperty('--t', (Math.log(z) / LOGMAX).toFixed(4));   /* 滑杆左边亮起的一段 */
    if (!quiet) syncClones();
  }
  /* 每一帧屏幕最多重画一次，手指动得再快也不会堆积 */
  function apply(){
    var o = origin();
    var mx = o.w * (z - 1) / 2, my = o.h * (z - 1) / 2;
    tx = clamp(tx, -mx, mx); ty = clamp(ty, -my, my);
    if (!painting) painting = requestAnimationFrame(paint);
  }
  /* 以 (cx,cy) 为中心缩放，坐标相对镜面中心。smooth 时用 0.22 秒滑过去，玻璃里的画面跟着一起动 */
  var tw = null;
  function tweenStep(now){
    if (!tw) return;
    if (tw.t0 === null) tw.t0 = now;
    var u = calm ? 1 : clamp((now - tw.t0) / 220, 0, 1), e = 1 - Math.pow(1 - u, 3);
    var nz = tw.z0 * Math.pow(tw.z1 / tw.z0, e), k = nz / tw.z0;
    tx = tw.cx - (tw.cx - tw.tx0) * k; ty = tw.cy - (tw.cy - tw.ty0) * k; z = nz;
    apply();
    if (u < 1) requestAnimationFrame(tweenStep); else tw = null;
  }
  function setZoom(nz, cx, cy, smooth){
    nz = clamp(nz, 1, ZMAX);
    cx = cx || 0; cy = cy || 0;
    if (smooth) {
      tw = { z0: z, z1: nz, tx0: tx, ty0: ty, cx: cx, cy: cy, t0: null };
      requestAnimationFrame(tweenStep);
      return;
    }
    tw = null;
    var k = nz / z;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; z = nz;
    apply();
  }
  /* 提示只在第一次使用时出现 */
  try { if (localStorage.getItem('mirrorHintSeen')) hint.hidden = true; } catch (_) {}
  function used(){
    hint.classList.add('gone');
    try { localStorage.setItem('mirrorHintSeen', '1'); } catch (_) {}
  }

  /* ================= 玻璃按钮 ================= */
  /* 四块玻璃：滑杆、左边两个按钮、快门、右边两个按钮。出现时都从快门的位置分出来。
     这里只在玻璃出现、收起、被按下的那零点几秒里动一动位置；玻璃停稳之后页面什么都不算，全靠手机自己合成 */
  var parts = [$('zoomrow'), $('groupL'), $('freeze'), $('groupR')];
  var N = parts.length, HUB = 2;
  var LENS = 10;                  /* 边缘折光：边上那一圈显示的是往里 10 像素处的画面 */
  var RING = 11;                  /* 折光那一圈有多宽 */
  function Spring(){ this.v = 0; this.vel = 0; this.t = 0; }
  Spring.prototype.step = function(dt, k, c){
    this.vel += (k * (this.t - this.v) - c * this.vel) * dt;
    this.v += this.vel * dt;
  };
  Spring.prototype.still = function(){
    return Math.abs(this.t - this.v) < 0.002 && Math.abs(this.vel) < 0.02;
  };
  var show = [], press = [], rest = [], bump = [], drawn = [], mag = [], maskKey = [];
  var lenses = [], worlds = [], pancs = [], clones = [];
  parts.forEach(function(el){
    show.push(new Spring()); press.push(new Spring());
    rest.push(null); bump.push(0.05); drawn.push(''); mag.push([1, 1]); maskKey.push('');
    /* 每块玻璃里放一份同样的摄像头画面，只在边缘那一圈露出来 */
    var lens = document.createElement('div'), world = document.createElement('div'), pc = document.createElement('div');
    var c = document.createElement('video');
    lens.className = 'lens'; lens.setAttribute('aria-hidden', 'true');
    world.className = 'world'; pc.className = 'panc';
    c.muted = true; c.defaultMuted = true; c.autoplay = true; c.playsInline = true; c.tabIndex = -1;
    c.setAttribute('muted', ''); c.setAttribute('playsinline', ''); c.setAttribute('autoplay', '');
    c.className = 'mirror';
    pc.appendChild(c); world.appendChild(pc); lens.appendChild(world);
    el.insertBefore(lens, el.firstChild);
    lenses.push(lens); worlds.push(world); pancs.push(pc); clones.push(c);
  });
  var quiet = true, raf = 0, last = 0, stagger = [], pressed = -1;
  /* 字和图标所在的每一小块：滑杆、倍数、四个按钮。各自按背后的明暗决定用白字还是深色字 */
  var spots = [document.querySelector('#zoomrow .rail'), $('zoomOut'), $('lamp'), $('boost'), $('reset'), $('flip')]
    .map(function(el){ return { el: el, x0: 0, y0: 0, x1: 0, y1: 0, on: false }; });
  var brightOn = [false, false, false, false];

  /* 边缘那一圈的形状：贴着玻璃的边，往里逐渐变淡 */
  function ringMask(w, h){
    try {
      var d = Math.min(window.devicePixelRatio || 1, 3), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * d)); c.height = Math.max(1, Math.round(h * d));
      var x = c.getContext('2d'), r = Math.min(w, h) / 2;
      x.scale(d, d); x.strokeStyle = '#fff';
      var outline = function(){
        x.beginPath(); x.moveTo(r, 0); x.lineTo(w - r, 0); x.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
        x.lineTo(r, h); x.arc(r, r, r, Math.PI / 2, Math.PI * 1.5); x.closePath();
      };
      for (var i = 0; i < 10; i++) {
        x.globalAlpha = 0.2; x.lineWidth = 2 * RING * (1 - 0.6 * i / 9); outline(); x.stroke();
      }
      x.globalAlpha = 1; x.lineWidth = 2 * RING * 0.4; outline(); x.stroke();
      return 'url(' + c.toDataURL() + ')';
    } catch (_) { return ''; }
  }

  /* 量出四块玻璃平时的位置（量的时候先把动画的位移去掉），并把每块玻璃里的那份画面对准外面的画面 */
  function measureGlass(){
    var o = origin(), sl = o.x - o.w / 2, st = o.y - o.h / 2, i, olds = [];
    for (i = 0; i < N; i++) { olds.push(parts[i].style.transform); parts[i].style.transform = 'none'; }
    var rects = parts.map(function(el){ return el.getBoundingClientRect(); });
    spots.forEach(function(sp){
      var q = sp.el.getBoundingClientRect();
      sp.x0 = q.left; sp.y0 = q.top; sp.x1 = q.right; sp.y1 = q.bottom;
    });
    for (i = 0; i < N; i++) parts[i].style.transform = olds[i];
    for (i = 0; i < N; i++) {
      var r = rects[i];
      if (!r.width || !r.height) continue;
      var hx = r.width / 2, hy = r.height / 2;
      rest[i] = { cx: r.left + hx, cy: r.top + hy, hx: hx, hy: hy };
      bump[i] = Math.min(0.05, 6 / hx);          /* 按下时鼓起多少：大块玻璃鼓得少一点 */
      mag[i] = [hx / Math.max(hx - LENS, 6), hy / Math.max(hy - LENS, 6)];
      var w = worlds[i].style;
      w.left = (sl - r.left) + 'px'; w.top = (st - r.top) + 'px';
      w.width = o.w + 'px'; w.height = o.h + 'px';
      w.transformOrigin = (r.left + hx - sl) + 'px ' + (r.top + hy - st) + 'px';
      var key = Math.round(r.width) + 'x' + Math.round(r.height);
      if (key !== maskKey[i]) {
        maskKey[i] = key;
        var m = ringMask(r.width, r.height);
        lenses[i].style.webkitMaskImage = m; lenses[i].style.maskImage = m;
      }
      drawn[i] = '';
    }
    placeParts();
  }
  function remeasure(){ box = null; apply(); measureGlass(); }

  /* 把每块玻璃此刻的位置、大小、透明度写到页面元素上；玻璃里的画面反着动同样多，始终和外面对齐 */
  function placeParts(){
    var hub = rest[HUB];
    if (!hub) return;
    for (var i = 0; i < N; i++) {
      var r = rest[i];
      if (!r) continue;
      var a = clamp(show[i].v, 0, 1.25), p = press[i].v;
      var dx = (hub.cx - r.cx) * (1 - a), dy = (hub.cy - r.cy) * (1 - a);
      var s = (0.45 + 0.55 * a) * (1 + bump[i] * p), o = clamp((a - 0.55) / 0.35, 0, 1);
      var key = dx.toFixed(2) + ',' + dy.toFixed(2) + ',' + s.toFixed(4) + ',' + o.toFixed(3);
      if (key === drawn[i]) continue;
      drawn[i] = key;
      parts[i].style.transform = 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0) scale(' + s.toFixed(4) + ')';
      parts[i].style.opacity = o.toFixed(3);
      worlds[i].style.transform = 'scale(' + (1 / s).toFixed(5) + ') translate3d(' + (-dx).toFixed(2) + 'px,' + (-dy).toFixed(2) + 'px,0) scale(' +
                                  mag[i][0].toFixed(4) + ',' + mag[i][1].toFixed(4) + ')';
    }
  }
  /* 玻璃里的画面跟着外面一起放大、移动 */
  function syncClones(){
    var t = pan.style.transform;
    for (var i = 0; i < N; i++) pancs[i].style.transform = t;
  }

  function kick(){ if (!raf && !document.hidden) raf = requestAnimationFrame(tick); }
  function tick(now){
    raf = 0;
    var dt = clamp((now - last) / 1000, 0.001, 0.034); last = now;
    var moving = false, shown = false;
    for (var i = 0; i < N; i++) {
      if (calm) { show[i].v = show[i].t; show[i].vel = 0; press[i].v = press[i].t; press[i].vel = 0; }
      else { show[i].step(dt, 230, 22); press[i].step(dt, 420, 25); }
      if (show[i].still()) { show[i].v = show[i].t; show[i].vel = 0; } else moving = true;
      if (press[i].still()) { press[i].v = press[i].t; press[i].vel = 0; } else moving = true;
      if (show[i].v > 0.003 || show[i].t > 0) shown = true;
    }
    placeParts();
    if (!shown && quiet) bar.style.visibility = 'hidden';
    if (moving) kick();                           /* 停稳了就不再每帧运行 */
  }

  /* ---------- 自动收起 ---------- */
  var quietTimer = null;
  function canHide(){ return lampLevel === 0 && $('msg').hidden; }
  function setShown(on){
    stagger.forEach(clearTimeout); stagger = [];
    var order = on ? [[2, 0], [1, 45], [3, 45], [0, 95]] : [[0, 0], [1, 35], [3, 35], [2, 70]];
    order.forEach(function(o){
      var id = setTimeout(function(){
        stagger = stagger.filter(function(x){ return x !== id; });
        show[o[0]].t = on ? 1 : 0; kick();
      }, calm ? 0 : o[1]);
      stagger.push(id);
    });
  }
  function wake(){
    clearTimeout(quietTimer);
    quietTimer = setTimeout(sleep, 3500);
    if (!quiet) return;
    quiet = false; body.classList.remove('quiet');
    bar.style.visibility = 'visible';
    syncClones();
    readTones(true);          /* 玻璃出现之前先量好，字一出来颜色就是对的 */
    tonesOn();
    setShown(true);
  }
  function sleep(force){
    clearTimeout(quietTimer);
    if (quiet || (force !== true && !canHide())) return;
    quiet = true; body.classList.add('quiet');
    release(); tonesOff();
    setShown(false);
  }
  function partOf(node){
    for (var i = 0; i < N; i++) if (parts[i].contains(node)) return i;
    return -1;
  }
  function glowAt(i, e){
    var r = rest[i];
    if (!r) return;
    parts[i].style.setProperty('--gx', (e.clientX - (r.cx - r.hx)).toFixed(0) + 'px');
    parts[i].style.setProperty('--gy', (e.clientY - (r.cy - r.hy)).toFixed(0) + 'px');
  }
  function release(){
    if (pressed < 0) return;
    press[pressed].t = 0; parts[pressed].classList.remove('pressed'); pressed = -1; kick();
  }
  bar.addEventListener('pointerdown', function(e){
    wake();
    var i = partOf(e.target);
    if (i < 0) return;
    release();
    pressed = i; press[i].t = 1; glowAt(i, e); parts[i].classList.add('pressed'); kick();
  });
  bar.addEventListener('pointermove', function(e){
    wake();
    if (pressed >= 0) glowAt(pressed, e);
  });
  ['input', 'click'].forEach(function(t){ bar.addEventListener(t, wake); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  /* ---------- 字的颜色跟着背后的画面变 ---------- */
  /* 按钮显示着的时候，每秒量一次每块玻璃背后画面的明暗：亮了就把字换成深色，暗了换回白色。
     只取一张很小的缩略图来量，按钮收起后就不量了 */
  var PW = 48, PH = 24, toneTimer = null, probe = document.createElement('canvas'), pctx = null;
  probe.width = PW; probe.height = PH;
  try { pctx = probe.getContext('2d', { willReadFrequently: true }); } catch (_) {}
  function tonesOn(){ tonesOff(); toneTimer = setInterval(readTones, 1000); }
  function tonesOff(){ clearInterval(toneTimer); toneTimer = null; }
  function toVideo(x, y){
    var o = origin(), vw = v.videoWidth, vh = v.videoHeight;
    var s = Math.max(o.w / vw, o.h / vh);
    var qx = (x - o.x - tx) / z, qy = (y - o.y - ty) / z;
    if (mirrored) qx = -qx;
    return [qx / s + vw / 2, qy / s + vh / 2];
  }
  function readTones(now){
    var vw = v.videoWidth, vh = v.videoHeight;
    if (!pctx || !vw || v.readyState < 2 || !rest[0] || quiet || lampLevel > 0 || document.hidden) return;
    if (raf && now !== true) return;              /* 玻璃正在动的那一小会儿不量，免得打断动画 */
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, i, r;
    for (i = 0; i < N; i++) {
      r = rest[i];
      if (!r) return;
      x0 = Math.min(x0, r.cx - r.hx); x1 = Math.max(x1, r.cx + r.hx);
      y0 = Math.min(y0, r.cy - r.hy); y1 = Math.max(y1, r.cy + r.hy);
    }
    var a = toVideo(x0, y0), b = toVideo(x1, y1);
    var sx0 = clamp(Math.min(a[0], b[0]), 0, vw), sx1 = clamp(Math.max(a[0], b[0]), 0, vw);
    var sy0 = clamp(Math.min(a[1], b[1]), 0, vh), sy1 = clamp(Math.max(a[1], b[1]), 0, vh);
    var sw = sx1 - sx0, sh = sy1 - sy0, d;
    if (sw < 0.001 || sh < 0.001) return;
    try {
      pctx.drawImage(v, sx0, sy0, sw, sh, 0, 0, PW, PH);
      d = pctx.getImageData(0, 0, PW, PH).data;
    } catch (_) { pctx = null; return; }
    /* 一小块区域背后的平均明暗，0 最暗 1 最亮 */
    var lumaOf = function(ax, ay, bx, by){
      var p = toVideo(ax, ay), q = toVideo(bx, by);
      var u0 = clamp(Math.floor((Math.min(p[0], q[0]) - sx0) / sw * PW), 0, PW - 1);
      var u1 = clamp(Math.ceil((Math.max(p[0], q[0]) - sx0) / sw * PW), u0 + 1, PW);
      var w0 = clamp(Math.floor((Math.min(p[1], q[1]) - sy0) / sh * PH), 0, PH - 1);
      var w1 = clamp(Math.ceil((Math.max(p[1], q[1]) - sy0) / sh * PH), w0 + 1, PH);
      var sum = 0, n = 0;
      for (var yy = w0; yy < w1; yy++) for (var xx = u0; xx < u1; xx++) {
        var k = (yy * PW + xx) * 4;
        sum += 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]; n++;
      }
      var L = n ? sum / n / 255 : 0;
      return boostOn ? clamp((Math.min(L * 1.4, 1) - 0.5) * 1.08 + 0.5, 0, 1) : L;
    };
    /* 亮于 0.56 换深色字，暗于 0.44 换回白字，中间留一段免得来回跳 */
    for (i = 0; i < N; i++) {
      r = rest[i];
      var Lp = lumaOf(r.cx - r.hx, r.cy - r.hy, r.cx + r.hx, r.cy + r.hy);
      if (Lp > 0.56) brightOn[i] = true; else if (Lp < 0.44) brightOn[i] = false;
      parts[i].classList.toggle('bright', brightOn[i]);
    }
    spots.forEach(function(sp){
      var L = lumaOf(sp.x0, sp.y0, sp.x1, sp.y1);
      if (L > 0.56) sp.on = true; else if (L < 0.44) sp.on = false;
      sp.el.classList.toggle('ink', sp.on);
    });
  }

  /* ================= 手势 ================= */
  var pts = new Map(), g = null, tapTimer = null, multi = false;
  function begin(){
    var a = Array.from(pts.values()), o = origin();
    if (a.length === 1) {
      g = { n: 1, x: a[0][0], y: a[0][1], tx: tx, ty: ty, moved: false };
    } else if (a.length >= 2) {
      g = { n: 2,
            d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]) || 1,
            mx: (a[0][0] + a[1][0]) / 2 - o.x, my: (a[0][1] + a[1][1]) / 2 - o.y,
            z: z, tx: tx, ty: ty };
    } else { g = null; }
  }
  stage.addEventListener('pointerdown', function(e){
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size >= 2) multi = true;      /* 用过两根手指的这一次，抬手时不算"点了一下" */
    tw = null;
    begin();
  });
  stage.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    var a = Array.from(pts.values()), o = origin();
    if (g.n === 1 && a.length === 1) {
      var dx = a[0][0] - g.x, dy = a[0][1] - g.y;
      if (!g.moved && Math.hypot(dx, dy) > 8) { g.moved = true; sleep(); }
      if (g.moved) { tx = g.tx + dx; ty = g.ty + dy; apply(); }
    } else if (g.n === 2 && a.length >= 2) {
      var d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
      var mx = (a[0][0] + a[1][0]) / 2 - o.x, my = (a[0][1] + a[1][1]) / 2 - o.y;
      var nz = clamp(g.z * d / g.d, 1, ZMAX), k = nz / g.z;
      tx = mx - (g.mx - g.tx) * k; ty = my - (g.my - g.ty) * k; z = nz;
      apply(); used(); sleep();
    }
  });
  function end(e){
    if (!pts.has(e.pointerId)) return;
    var tap = g && g.n === 1 && !g.moved && !multi && e.type === 'pointerup';
    pts.delete(e.pointerId);
    if (pts.size === 0) multi = false;
    begin();
    if (!tap) return;
    if (tapTimer) {                       /* 第二下：双击放大 */
      clearTimeout(tapTimer); tapTimer = null;
      var o = origin();
      setZoom(z > 1.05 ? 1 : 3, e.clientX - o.x, e.clientY - o.y, true);
      used();
    } else {                              /* 只点了一下：收起或显示按钮 */
      tapTimer = setTimeout(function(){
        tapTimer = null;
        if (quiet) wake(); else sleep();
      }, 280);
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  /* 阻止 Safari 自己的整页缩放 */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
  });

  zoomEl.addEventListener('input', function(){
    setZoom(Math.exp(parseFloat(zoomEl.value) * LOGMAX)); used();
  });
  $('reset').addEventListener('click', function(){ setZoom(1, 0, 0, true); });
  window.addEventListener('resize', remeasure);

  /* ================= 摄像头 ================= */
  function stop(){
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null; track = null; torch = false; canTorch = false;
  }
  function fail(name){
    var t = '需要打开摄像头', m;
    if (name === 'insecure') {
      t = '这样打开用不了摄像头';
      m = '请通过 https 开头的网址打开这个页面。直接打开文件时，浏览器不允许使用摄像头。';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      m = '镜子需要用到摄像头。请点下面的按钮并选择“允许”。如果没有弹出询问，到“设置”里找到 Safari 浏览器 → 相机，改成“允许”。';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      t = '没有找到摄像头';
      m = '这台设备上没有可用的摄像头，或者它正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    } else {
      t = '摄像头没有打开';
      m = '可能正被别的 App 占用。关掉其他正在用相机的 App 再试一次。';
    }
    $('msgTitle').textContent = t;
    $('msgText').textContent = m;
    $('msg').hidden = false;
    sleep(true);
  }
  function setFrozen(on){
    frozen = on;
    $('freeze').setAttribute('aria-pressed', String(on));
    $('freezeLabel').textContent = on ? '继续' : '定格';
    stateChip.hidden = !on;
    if (on) { hint.hidden = true; }
    [v].concat(clones).forEach(function(el){
      if (on) { el.pause(); return; }
      var p = el.play(); if (p && p.catch) p.catch(function(){});
    });
  }
  var settleTimer = null;
  function setLamp(level){
    lampLevel = level;
    body.classList.toggle('lamp', level > 0);
    body.classList.toggle('lamp2', level === 2);
    /* 镜面正在变大小的这一小会儿，先用备用的玻璃样子，等它停稳再换回来 */
    body.classList.add('settling');
    box = null;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      remeasure();
      body.classList.remove('settling');
    }, 320);
    syncLampButton();
    wake();
  }
  function syncLampButton(){
    var useTorch = facing === 'environment' && canTorch;
    $('lampLabel').textContent = useTorch ? '手电' : (lampLevel === 2 ? '强光' : '补光');
    $('lamp').setAttribute('aria-pressed', String(useTorch ? torch : lampLevel > 0));
  }
  async function start(){
    if (starting) return;
    starting = true;
    stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      starting = false; fail('insecure'); return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } }
      });
    } catch (err) {
      starting = false; fail(err && err.name); return;
    }
    $('msg').hidden = true;
    track = stream.getVideoTracks()[0];
    var caps = (track.getCapabilities && track.getCapabilities()) || {};
    canTorch = !!caps.torch;
    mirrored = facing === 'user';
    [v].concat(clones).forEach(function(el){
      el.classList.toggle('mirror', mirrored);
      el.srcObject = stream;
    });
    setFrozen(false);
    $('flipLabel').textContent = facing === 'user' ? '后置' : '前置';
    if (facing === 'environment' && canTorch && lampLevel) setLamp(0);
    syncLampButton();
    apply();
    keepAwake();
    measureGlass();
    wake();
    starting = false;
  }

  $('retry').addEventListener('click', start);
  $('freeze').addEventListener('click', function(){ setFrozen(!frozen); used(); });
  $('flip').addEventListener('click', function(){
    facing = facing === 'user' ? 'environment' : 'user';
    start();
  });
  $('boost').addEventListener('click', function(){
    boostOn = body.classList.toggle('boost');
    this.setAttribute('aria-pressed', String(boostOn));
    setTimeout(function(){ readTones(true); }, 60);
  });
  $('lamp').addEventListener('click', function(){
    if (facing === 'environment' && canTorch && track) {
      torch = !torch;
      track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function(){ torch = false; syncLampButton(); });
      syncLampButton();
    } else {
      setLamp((lampLevel + 1) % 3);   /* 关 → 补光 → 强光 → 关 */
    }
  });

  /* 屏幕常亮，免得检查到一半自动锁屏 */
  function keepAwake(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').catch(function(){});
  }
  /* 从后台回来时，摄像头常常已被系统停掉，重新打开 */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    keepAwake();
    kick();
    if (frozen) return;
    if (!track || track.readyState !== 'live' || track.muted) start();
  });

  /* 有新版本时自己换上：手机发现新版本后页面自动重新载入一次，不用再手动关掉重开两遍 */
  if ('serviceWorker' in navigator) {
    var hadWorker = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadWorker || reloaded) return;
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      /* 每次打开、每次从后台回来，都主动问一次有没有新版本 */
      var ask = function(){ try { reg.update().catch(function(){}); } catch (_) {} };
      ask();
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') ask();
      });
    }).catch(function(){});
  }

  apply();
  measureGlass();
  setTimeout(measureGlass, 600);
  start();
})();
</script>
</body>
</html>
